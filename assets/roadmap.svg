<rect x="296" y="208" width="248" height="33" rx="10" fill="#fff" opacity=".07"/>
<text class="f" x="308" y="233" font-size="17" font-weight="800" fill="#8b5cf6">Build</text>
<text class="f" x="308" y="256" font-size="11.5" fill="#d7dcf0">Iterative delivery with Git and CI/CD</text>
<g filter="url(#glow)"><circle class="pulse" cx="420" cy="330" r="21" fill="#8b5cf6" opacity=".25"/></g>
<circle cx="420" cy="334" r="16" fill="#000" opacity=".55"/>
<circle cx="420" cy="330" r="16" fill="#8b5cf6" stroke="#fff" stroke-width="2"/>
<text class="f" x="420" y="336" text-anchor="middle" font-size="16" font-weight="900" fill="#0d0221">3</text>
</g>
