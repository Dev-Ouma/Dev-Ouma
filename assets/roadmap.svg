<rect x="148" y="432" width="248" height="33" rx="10" fill="#fff" opacity=".07"/>
<text class="f" x="160" y="457" font-size="17" font-weight="800" fill="#00d4ff">Design</text>
<text class="f" x="160" y="480" font-size="11.5" fill="#d7dcf0">Architecture, data model, clear plan</text>
<g filter="url(#glow)"><circle class="pulse" cx="272" cy="372" r="21" fill="#00d4ff" opacity=".25"/></g>
<circle cx="272" cy="376" r="16" fill="#000" opacity=".55"/>
<circle cx="272" cy="372" r="16" fill="#00d4ff" stroke="#fff" stroke-width="2"/>
<text class="f" x="272" y="378" text-anchor="middle" font-size="16" font-weight="900" fill="#0d0221">2</text>
</g>
<g>
<line x1="420" y1="330" x2="420" y2="272" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3 4" opacity=".8"/>
