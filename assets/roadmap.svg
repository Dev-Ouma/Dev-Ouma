.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
</style>
<rect width="840" height="540" rx="20" fill="url(#bg)"/>
<g opacity=".22" stroke="#10FF10" stroke-width=".6"><line x1="0" y1="0" x2="0" y2="540"/><line x1="40" y1="0" x2="40" y2="540"/><line x1="80" y1="0" x2="80" y2="540"/><line x1="120" y1="0" x2="120" y2="540"/><line x1="160" y1="0" x2="160" y2="540"/><line x1="200" y1="0" x2="200" y2="540"/><line x1="240" y1="0" x2="240" y2="540"/><line x1="280" y1="0" x2="280" y2="540"/><line x1="320" y1="0" x2="320" y2="540"/><line x1="360" y1="0" x2="360" y2="540"/><line x1="400" y1="0" x2="400" y2="540"/><line x1="440" y1="0" x2="440" y2="540"/><line x1="480" y1="0" x2="480" y2="540"/><line x1="520" y1="0" x2="520" y2="540"/><line x1="560" y1="0" x2="560" y2="540"/><line x1="600" y1="0" x2="600" y2="540"/><line x1="640" y1="0" x2="640" y2="540"/><line x1="680" y1="0" x2="680" y2="540"/><line x1="720" y1="0" x2="720" y2="540"/><line x1="760" y1="0" x2="760" y2="540"/><line x1="800" y1="0" x2="800" y2="540"/><line x1="840" y1="0" x2="840" y2="540"/><line x1="0" y1="0" x2="840" y2="0"/><line x1="0" y1="40" x2="840" y2="40"/><line x1="0" y1="80" x2="840" y2="80"/><line x1="0" y1="120" x2="840" y2="120"/><line x1="0" y1="160" x2="840" y2="160"/><line x1="0" y1="200" x2="840" y2="200"/><line x1="0" y1="240" x2="840" y2="240"/><line x1="0" y1="280" x2="840" y2="280"/><line x1="0" y1="320" x2="840" y2="320"/><line x1="0" y1="360" x2="840" y2="360"/><line x1="0" y1="400" x2="840" y2="400"/><line x1="0" y1="440" x2="840" y2="440"/><line x1="0" y1="480" x2="840" y2="480"/><line x1="0" y1="520" x2="840" y2="520"/></g>
<use href="#road" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="58" stroke-linecap="round" transform="translate(0,14)" filter="url(#sh)"/>
