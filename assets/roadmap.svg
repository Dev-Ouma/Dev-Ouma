<line x1="568" y1="285" x2="568" y2="343" stroke="#ff9f1c" stroke-width="2" stroke-dasharray="3 4" opacity=".8"/>
<g filter="url(#sh)"><rect x="442" y="343" width="252" height="66" rx="12" fill="url(#card)" stroke="#ff9f1c" stroke-width="1.8"/></g>
<rect x="444" y="345" width="248" height="33" rx="10" fill="#fff" opacity=".07"/>
<text class="f" x="456" y="370" font-size="17" font-weight="800" fill="#ff9f1c">Harden</text>
<text class="f" x="456" y="393" font-size="11.5" fill="#d7dcf0">Security, backups, monitoring, load tests</text>
<g filter="url(#glow)"><circle class="pulse" cx="568" cy="285" r="21" fill="#ff9f1c" opacity=".25"/></g>
<circle cx="568" cy="289" r="16" fill="#000" opacity=".55"/>
<circle cx="568" cy="285" r="16" fill="#ff9f1c" stroke="#fff" stroke-width="2"/>
