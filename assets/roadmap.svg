<rect x="580" y="75" width="248" height="33" rx="10" fill="#fff" opacity=".07"/>
<text class="f" x="592" y="100" font-size="17" font-weight="800" fill="#ff4d6d">Hand over</text>
<text class="f" x="592" y="123" font-size="11.5" fill="#d7dcf0">Docs, training, ongoing support</text>
<g filter="url(#glow)"><circle class="pulse" cx="720" cy="197" r="21" fill="#ff4d6d" opacity=".25"/></g>
<circle cx="720" cy="201" r="16" fill="#000" opacity=".55"/>
<circle cx="720" cy="197" r="16" fill="#ff4d6d" stroke="#fff" stroke-width="2"/>
<text class="f" x="720" y="203" text-anchor="middle" font-size="16" font-weight="900" fill="#0d0221">5</text>
</g>
<g filter="url(#sh)"><g><rect x="-14" y="-8" width="28" height="16" rx="5" fill="#10FF10"/><rect x="-6" y="-6" width="12" height="12" rx="3" fill="#0d0221" opacity=".7"/><circle cx="-8" cy="-9" r="3" fill="#000"/><circle cx="8" cy="-9" r="3" fill="#000"/><circle cx="-8" cy="9" r="3" fill="#000"/><circle cx="8" cy="9" r="3" fill="#000"/>
<animateMotion dur="9s" repeatCount="indefinite" rotate="auto"><mpath href="#road"/></animateMotion></g></g>
<text class="f" x="50" y="512" font-size="12" fill="#9aa3c0" letter-spacing="2">START</text>
<text class="f" x="790" y="150" text-anchor="end" font-size="12" fill="#9aa3c0" letter-spacing="2">LIVE</text>
