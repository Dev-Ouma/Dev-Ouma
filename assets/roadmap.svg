<svg xmlns="http://www.w3.org/2000/svg" width="840" height="128" viewBox="0 0 840 128" role="img" aria-label="How I work: Discover, Design, Build, Harden, Hand over">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0221"/><stop offset="1" stop-color="#0a3d62"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".6"/></filter>
<path id="road" d="M18,40 L822,40"/>
</defs>
<style>
.f{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
.dash{animation:mv 1.2s linear infinite}@keyframes mv{to{stroke-dashoffset:-26}}
</style>
<rect width="840" height="128" rx="16" fill="url(#bg)"/>
<use href="#road" stroke="#000" stroke-opacity=".6" stroke-width="30" stroke-linecap="round" transform="translate(0,8)" filter="url(#sh)"/>
<use href="#road" stroke="#06070f" stroke-width="30" stroke-linecap="round" transform="translate(0,5)"/>
<use href="#road" stroke="#9aa3c0" stroke-width="28" stroke-linecap="round"/>
<use href="#road" stroke="#1b1e2b" stroke-width="22" stroke-linecap="round"/>
<use href="#road" stroke="#fff" stroke-opacity=".08" stroke-width="8" stroke-linecap="round" transform="translate(0,-5)"/>
<use class="dash" href="#road" stroke="#ffd60a" stroke-width="2" stroke-dasharray="12 10"/>
<g>
<circle cx="84" cy="43" r="13" fill="#000" opacity=".55"/>
<circle cx="84" cy="40" r="13" fill="#10FF10" stroke="#fff" stroke-width="2" filter="url(#sh)"/>
<text class="f" x="84" y="45" text-anchor="middle" font-size="14" font-weight="900" fill="#0d0221">1</text>
<text class="f" x="84" y="86" text-anchor="middle" font-size="15" font-weight="800" fill="#10FF10">Discover</text>
<text class="f" x="84" y="104" text-anchor="middle" font-size="11" fill="#d7dcf0">Problem, users, scope</text>
</g>
<g>
<circle cx="252" cy="43" r="13" fill="#000" opacity=".55"/>
<circle cx="252" cy="40" r="13" fill="#00d4ff" stroke="#fff" stroke-width="2" filter="url(#sh)"/>
<text class="f" x="252" y="45" text-anchor="middle" font-size="14" font-weight="900" fill="#0d0221">2</text>
<text class="f" x="252" y="86" text-anchor="middle" font-size="15" font-weight="800" fill="#00d4ff">Design</text>
<text class="f" x="252" y="104" text-anchor="middle" font-size="11" fill="#d7dcf0">Architecture &amp; plan</text>
</g>
<g>
<circle cx="420" cy="43" r="13" fill="#000" opacity=".55"/>
<circle cx="420" cy="40" r="13" fill="#8b5cf6" stroke="#fff" stroke-width="2" filter="url(#sh)"/>
<text class="f" x="420" y="45" text-anchor="middle" font-size="14" font-weight="900" fill="#0d0221">3</text>
<text class="f" x="420" y="86" text-anchor="middle" font-size="15" font-weight="800" fill="#8b5cf6">Build</text>
<text class="f" x="420" y="104" text-anchor="middle" font-size="11" fill="#d7dcf0">Git &amp; CI/CD delivery</text>
</g>
<g>
<circle cx="588" cy="43" r="13" fill="#000" opacity=".55"/>
<circle cx="588" cy="40" r="13" fill="#ff9f1c" stroke="#fff" stroke-width="2" filter="url(#sh)"/>
<text class="f" x="588" y="45" text-anchor="middle" font-size="14" font-weight="900" fill="#0d0221">4</text>
<text class="f" x="588" y="86" text-anchor="middle" font-size="15" font-weight="800" fill="#ff9f1c">Harden</text>
<text class="f" x="588" y="104" text-anchor="middle" font-size="11" fill="#d7dcf0">Security &amp; backups</text>
</g>
<g>
<circle cx="756" cy="43" r="13" fill="#000" opacity=".55"/>
<circle cx="756" cy="40" r="13" fill="#ff4d6d" stroke="#fff" stroke-width="2" filter="url(#sh)"/>
<text class="f" x="756" y="45" text-anchor="middle" font-size="14" font-weight="900" fill="#0d0221">5</text>
<text class="f" x="756" y="86" text-anchor="middle" font-size="15" font-weight="800" fill="#ff4d6d">Hand over</text>
<text class="f" x="756" y="104" text-anchor="middle" font-size="11" fill="#d7dcf0">Docs &amp; training</text>
</g>
<g filter="url(#sh)"><g><rect x="-11" y="-6" width="22" height="12" rx="4" fill="#10FF10"/><rect x="-4" y="-4.5" width="9" height="9" rx="2" fill="#0d0221" opacity=".7"/>
<animateMotion dur="8s" repeatCount="indefinite" rotate="auto"><mpath href="#road"/></animateMotion></g></g>
</svg>
