<rect x="12" y="331" width="248" height="33" rx="10" fill="#fff" opacity=".07"/>
<text class="f" x="24" y="356" font-size="17" font-weight="800" fill="#10FF10">Discover</text>
<text class="f" x="24" y="379" font-size="11.5" fill="#d7dcf0">Understand problem, users, constraints</text>
<g filter="url(#glow)"><circle class="pulse" cx="120" cy="453" r="21" fill="#10FF10" opacity=".25"/></g>
<circle cx="120" cy="457" r="16" fill="#000" opacity=".55"/>
<circle cx="120" cy="453" r="16" fill="#10FF10" stroke="#fff" stroke-width="2"/>
