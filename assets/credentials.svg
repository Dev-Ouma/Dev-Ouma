<svg xmlns="http://www.w3.org/2000/svg" width="780" height="190" viewBox="0 0 780 190" role="img" aria-label="Credentials: MSc Computer Science (in progress), IBM AI Certification, Huawei HCIA">
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="9" flood-color="#000" flood-opacity=".55"/></filter>
<linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2f45"/><stop offset="1" stop-color="#0d0f1c"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="g0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10FF10"/><stop offset="1" stop-color="#0a8f2a"/></linearGradient>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#0a2fa0"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4d5e"/><stop offset="1" stop-color="#8f0a1c"/></linearGradient>
</defs>
<style>
.f{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
.float0{animation:fl 4s ease-in-out infinite}.float1{animation:fl 4s ease-in-out .6s infinite}.float2{animation:fl 4s ease-in-out 1.2s infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
</style>
<g class="float0">
<g filter="url(#sh)">
<rect x="12" y="26" width="232" height="150" rx="18" fill="#0a8f2a"/>
<rect x="12" y="18" width="232" height="150" rx="18" fill="url(#face)" stroke="url(#g0)" stroke-width="2.5"/>
</g>
<rect x="14" y="20" width="228" height="75" rx="16" fill="url(#shine)"/>
<rect x="34" y="42" width="46" height="6" rx="3" fill="url(#g0)"/>
<text class="f" x="34" y="86" font-size="26" font-weight="800" fill="url(#g0)" letter-spacing="1">MSc</text>
<text class="f" x="34" y="114" font-size="17" font-weight="600" fill="#ffffff">Computer Science</text>
<text class="f" x="34" y="144" font-size="13" fill="#9aa3c0">● In progress</text>
</g>
<g class="float1">
<g filter="url(#sh)">
<rect x="274" y="26" width="232" height="150" rx="18" fill="#0a2fa0"/>
<rect x="274" y="18" width="232" height="150" rx="18" fill="url(#face)" stroke="url(#g1)" stroke-width="2.5"/>
</g>
<rect x="276" y="20" width="228" height="75" rx="16" fill="url(#shine)"/>
<rect x="296" y="42" width="46" height="6" rx="3" fill="url(#g1)"/>
<text class="f" x="296" y="86" font-size="26" font-weight="800" fill="url(#g1)" letter-spacing="1">IBM</text>
<text class="f" x="296" y="114" font-size="17" font-weight="600" fill="#ffffff">AI Certification</text>
<text class="f" x="296" y="144" font-size="13" fill="#9aa3c0">● Certified</text>
</g>
<g class="float2">
<g filter="url(#sh)">
<rect x="536" y="26" width="232" height="150" rx="18" fill="#8f0a1c"/>
<rect x="536" y="18" width="232" height="150" rx="18" fill="url(#face)" stroke="url(#g2)" stroke-width="2.5"/>
</g>
<rect x="538" y="20" width="228" height="75" rx="16" fill="url(#shine)"/>
<rect x="558" y="42" width="46" height="6" rx="3" fill="url(#g2)"/>
<text class="f" x="558" y="86" font-size="26" font-weight="800" fill="url(#g2)" letter-spacing="1">HUAWEI</text>
<text class="f" x="558" y="114" font-size="17" font-weight="600" fill="#ffffff">HCIA</text>
<text class="f" x="558" y="144" font-size="13" fill="#9aa3c0">● Certified</text>
</g>
</svg>
